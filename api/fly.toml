app = "arunika-workforce-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  COOKIE_SECURE = "true"
  DEMO_MODE = "1"
  LLM_MODEL = "gemini-3.5-flash"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/live"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
