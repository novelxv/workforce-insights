name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: insights
          POSTGRES_PASSWORD: insights
          POSTGRES_DB: insights
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insights"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://insights:insights@localhost:5432/insights
      TEST_DATABASE_URL: postgresql://insights:insights@localhost:5432/insights
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[pipeline,dev]"
      - run: ruff check . && ruff format --check .
      - name: Simulate, load the warehouse and train the model
        run: python -m pipeline.build
      - name: Ask parser accuracy
        run: python -m scripts.evaluate_ask
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          API_ORIGIN: https://example.invalid
